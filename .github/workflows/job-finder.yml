name: Job Finder

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"    # 8:00 AM IST
    - cron: "30 9 * * *"    # 3:00 PM IST
    - cron: "30 16 * * *"   # 10:00 PM IST
    - cron: "50 4 * * *"    # TEMPORARY TEST: 10:20 AM IST
    
  # on:
  # workflow_dispatch:

  # schedule:
  #   - cron: "0 8 * * *"
  #     timezone: "Asia/Kolkata"

  #   - cron: "0 15 * * *"
  #     timezone: "Asia/Kolkata"

  #   - cron: "0 22 * * *"
  #     timezone: "Asia/Kolkata"

jobs:
  job-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"

      EMAIL_ENABLED: "true"
      SMTP_USE_TLS: "true"
      SCHEDULER_ENABLED: "false"

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REPORT_DIR: reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ensure workspace directories exist
        run: |
          mkdir -p data reports

      - name: Run job collection
        run: |
          python -m job_finder collect --limit 50

      - name: Finalize report and send email
        run: |
          python -m job_finder finalize